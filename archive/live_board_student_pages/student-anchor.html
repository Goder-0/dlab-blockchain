<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Anchor</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: rgba(255, 250, 242, 0.9);
        --text: #1f2937;
        --muted: #6b7280;
        --line: #d6c7b4;
        --accent: #b45309;
        --accent-2: #0f766e;
        --ok: #15803d;
        --bad: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 0% 0%, rgba(180, 83, 9, 0.18), transparent 28%),
          radial-gradient(circle at 100% 10%, rgba(15, 118, 110, 0.16), transparent 24%),
          linear-gradient(180deg, #f8f3ea 0%, #eee6da 100%);
      }

      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 16px 56px;
      }

      .hero {
        display: grid;
        gap: 16px;
        grid-template-columns: 1.1fr 0.9fr;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 12px 30px rgba(85, 61, 34, 0.08);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
        color: #7c2d12;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
      }

      input, textarea, button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        background: rgba(255, 255, 255, 0.86);
      }

      textarea {
        min-height: 98px;
        resize: vertical;
      }

      button {
        border: none;
        cursor: pointer;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--accent) 0%, #c2410c 100%);
      }

      button:hover { filter: brightness(1.04); }

      .status {
        min-height: 22px;
        font-size: 14px;
        font-weight: 600;
      }

      .ok { color: var(--ok); }
      .bad { color: var(--bad); }

      .mini-card {
        border: 1px dashed var(--line);
        border-radius: 18px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.55);
      }

      .mini-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .mini-item {
        border-radius: 14px;
        border: 1px solid rgba(180, 83, 9, 0.18);
        background: rgba(255, 255, 255, 0.76);
        padding: 12px;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
      }

      code {
        font-family: "SFMono-Regular", ui-monospace, monospace;
        font-size: 12px;
        word-break: break-all;
      }

      @media (max-width: 820px) {
        .hero { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <section class="panel stack">
          <span class="tag">Local -> Testnet</span>
          <div>
            <h1>블록 해시 기록</h1>
            <p>로컬 실습에서 얻은 결과를 정리해서 제출하는 화면입니다.</p>
          </div>
          <div class="mini-card">
            <strong>학생 안내</strong>
            <p style="margin-top: 6px;">팀명과 단계, 메모를 적고 제출하세요. 해시를 이미 알고 있다면 같이 적어도 됩니다.</p>
          </div>
        </section>

        <section class="panel">
          <form id="anchorForm" class="stack">
            <label>팀명
              <input id="team" placeholder="예: team1" />
            </label>
            <label>실습 단계
              <input id="step" value="step3" placeholder="예: step3" />
            </label>
            <label>로컬 블록 해시
              <input id="localHash" placeholder="선택: 64자리 hex" />
            </label>
            <label>메모
              <textarea id="note" placeholder="예: accepted tx batch"></textarea>
            </label>
            <button type="submit">기록 요청 보내기</button>
            <div id="status" class="status"></div>
          </form>
        </section>
      </div>

      <section class="panel" style="margin-top: 16px;">
        <strong>최근 제출</strong>
        <div id="summary" class="meta" style="margin-top: 8px;">불러오는 중...</div>
        <div id="items" class="mini-list"></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function fetchItems() {
        const res = await fetch("/api/anchor_requests");
        return await res.json();
      }

      async function postItem(payload) {
        const res = await fetch("/api/anchor_requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "submit failed");
        return body;
      }

      function render(data) {
        $("summary").textContent = `현재 제출 수: ${data.count}`;
        const items = $("items");
        if (!data.items.length) {
          items.innerHTML = `<div class="meta">아직 제출이 없습니다.</div>`;
          return;
        }
        items.innerHTML = data.items.slice().reverse().map((item) => `
          <article class="mini-item">
            <div><strong>${escapeHtml(item.team)}</strong> · ${escapeHtml(item.step)}</div>
            <div class="meta" style="margin-top: 6px;">${escapeHtml(item.note)}</div>
            <div class="meta" style="margin-top: 8px;"><code>${escapeHtml(item.local_hash || "(hash not provided)")}</code></div>
          </article>
        `).join("");
      }

      async function refresh() {
        render(await fetchItems());
      }

      $("anchorForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = $("status");
        status.className = "status";
        status.textContent = "전송 중...";
        try {
          await postItem({
            team: $("team").value.trim(),
            step: $("step").value.trim(),
            local_hash: $("localHash").value.trim(),
            note: $("note").value.trim(),
          });
          status.className = "status ok";
          status.textContent = "제출 완료";
          $("anchorForm").reset();
          $("step").value = "step3";
          await refresh();
        } catch (error) {
          status.className = "status bad";
          status.textContent = error.message;
        }
      });

      refresh();
    </script>
  </body>
</html>
